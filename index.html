<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>飞行搭档</title>
    <script>
        // The words around the game follow the language picked last time, even before the game loads.
        try {
            if (JSON.parse(localStorage.getItem("flight_friends_pets") || "{}").language === "en") {
                document.documentElement.lang = "en";
                document.title = "Flight Friends";
            }
        } catch (error) {}
    </script>
    <link rel="icon" type="image/png" href="favicon.png?v=57692ebf770c">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background: #6f9f8d; }
        body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        /* A soft glow of the game's own world, so nothing competes with the game itself. */
        .page-sky {
            position: fixed; top: -80px; right: -80px; bottom: -80px; left: -80px;
            z-index: 0; opacity: 0;
            background-position: center;
            background-size: cover;
            filter: blur(40px) saturate(1.15);
            transition: opacity 1.5s;
        }
        .page-shade {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1;
            background: radial-gradient(ellipse at center, rgba(16, 22, 20, 0.05), rgba(16, 22, 20, 0.42));
        }
        body[data-theme="0"] #page-sky-0,
        body[data-theme="1"] #page-sky-1,
        body[data-theme="2"] #page-sky-2 { opacity: 1; }
        /* The game stays 4:3. A shadow instead of a border keeps the mouse position exact.
           Smooth scaling keeps moving pixels even, because the game is rarely a whole-number size. */
        canvas#canvas {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; margin: auto; z-index: 2;
            width: 800px; height: 600px;
            width: min(calc(100vw - 56px), calc((100vh - 56px) * 4 / 3));
            height: min(calc(100vh - 56px), calc((100vw - 56px) * 3 / 4));
            image-rendering: auto;
            border-radius: 10px;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35), 0 22px 60px rgba(8, 14, 12, 0.5);
            touch-action: none;
            outline: none;
        }
        #infobox {
            position: fixed; left: 50%; top: 50%; z-index: 3;
            -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);
            background: rgba(255, 241, 208, 0.96); color: #342014;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(8, 14, 12, 0.35);
            font-size: 18px; letter-spacing: 2px; padding: 14px 28px; white-space: nowrap;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        html[lang="en"] .zh, html:not([lang="en"]) .en { display: none; }
        .privacy-note {
            position: fixed; left: 0; right: 0; bottom: 6px; z-index: 2; text-align: center;
            color: rgba(255, 255, 255, 0.6); font-size: 11px; pointer-events: none;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body data-theme="0">
    <div class="page-sky" id="page-sky-0" style="background-image: url(page_sky_0.png?v=57692ebf770c)"></div>
    <div class="page-sky" id="page-sky-1" style="background-image: url(page_sky_1.png?v=57692ebf770c)"></div>
    <div class="page-sky" id="page-sky-2" style="background-image: url(page_sky_2.png?v=57692ebf770c)"></div>
    <div class="page-shade"></div><script>
(function () {
    var KEY = "phc_nV6D9iCxsfsMbCe7FxLUqFneY9r5QrCSM6MUQZHs5gdU", HOST = "https://us.i.posthog.com";
    window.flightFriendsTrack = function () {};
    if (navigator.globalPrivacyControl || !window.fetch) return;
    if (/[?&]dev=/.test(location.search)) return;  // The developer's own link is never counted.
    function makeId() {
        // Older browsers have no randomUUID, so build the same shape from random numbers.
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (mark) {
            var number = Math.random() * 16 | 0;
            return (mark === "x" ? number : (number & 3 | 8)).toString(16);
        });
    }
    var visitor = null, isNew = false;
    try { visitor = localStorage.getItem("flight_friends_visitor"); } catch (e) {}
    if (!visitor) {
        visitor = makeId();
        isNew = true;
        try { localStorage.setItem("flight_friends_visitor", visitor); } catch (e) {}
    }
    var linkedPet = null;
    try { linkedPet = new URLSearchParams(location.search).get("pet"); } catch (e) {}
    var from = "direct";
    try { if (document.referrer) from = new URL(document.referrer).hostname; } catch (e) {}
    function send(event, details) {
        var properties = {
            linked_pet: linkedPet ? linkedPet.slice(0, 32) : "none",
            came_from: from,
            screen_width: window.innerWidth,
            seconds_since_open: Math.round(performance.now() / 1000),
            is_wechat: /MicroMessenger/i.test(navigator.userAgent),
            is_mobile: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent),
            $process_person_profile: false
        };
        for (var name in details) properties[name] = details[name];
        try {
            fetch(HOST + "/i/v0/e/", {
                method: "POST",
                keepalive: true,
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({api_key: KEY, event: event, distinct_id: visitor,
                                      properties: properties, timestamp: new Date().toISOString()})
            }).catch(function () {});
        } catch (e) {}
    }
    // The files finish downloading in this order, so the last one found shows how far loading got.
    var LOAD_STAGES = [["game.js", "game_script"], ["font.png", "font"],
                       ["scenery/", "scenery"], ["pets/", "pets"]];
    function loadStage() {
        var names = "";
        try {
            names = performance.getEntriesByType("resource").map(function (entry) {
                return entry.name;
            }).join(" ");
        } catch (e) {}
        var stage = "nothing";
        LOAD_STAGES.forEach(function (item) {
            if (names.indexOf(item[0]) >= 0) stage = item[1];
        });
        return stage;
    }
    var gameReady = false, leftEarly = false;
    window.flightFriendsTrack = function (event, details) {
        if (event === "game_ready") gameReady = true;
        send(event, JSON.parse(details));
    };
    send("page_open", {new_visitor: isNew});
    [15, 45].forEach(function (seconds) {
        setTimeout(function () {
            if (!gameReady) send("load_waiting", {stage: loadStage(), waited: seconds});
        }, seconds * 1000);
    });
    function reportLeaving() {
        if (gameReady || leftEarly) return;
        leftEarly = true;
        send("load_left", {stage: loadStage()});
    }
    // WeChat may only hide the page when it closes, so both signals count as leaving.
    window.addEventListener("pagehide", reportLeaving);
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") reportLeaving();
    });
})();
</script><div class="privacy-note"><span class="zh">本游戏匿名统计游玩数据，不含姓名、照片和联系方式</span><span class="en">This game counts plays anonymously: no names, photos or contact details</span></div>
    <canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
    <div id="infobox"><span class="zh">正在准备起飞…</span><span class="en">Getting ready for takeoff…</span></div>
    <script>window.GAME_VERSION = "57692ebf770c";</script>
    <script src="game.js?v=57692ebf770c"></script>
</body>
</html>
